<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Project Report Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; color: #334155; }
        .tool-header { background-color: #0f172a; color: white; padding: 20px 25px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card { border: none; border-radius: 8px; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); margin-bottom: 24px; }
        .card-header { background-color: #fff; border-bottom: 1px solid #e2e8f0; font-weight: 600; color: #0f172a; padding: 15px 20px; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .card-body { padding: 20px; }
        label { font-weight: 500; color: #475569; font-size: 0.9rem; margin-bottom: 4px; }
        
        /* Print specific styles for Professional PDF Export */
        @media print {
            @page { size: A4 portrait; margin: 8mm !important; }
            body { background-color: white; font-size: 9.5pt; color: #000; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .report-container { padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; width: 100%; max-width: 100%; }
            .page-break { page-break-after: always !important; }
            
            /* Stretch Tables */
            table { width: 100% !important; border-collapse: collapse; margin-bottom: 20px; page-break-inside: avoid; table-layout: auto; }
            .table-bordered th, .table-bordered td { border: 1px solid #cbd5e1 !important; padding: 6px !important; word-wrap: break-word; }
            th { background-color: #1e293b !important; color: #ffffff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 9pt; font-weight: 600; text-align: center; }
            td { font-size: 9pt; color: #0f172a; }
            
            .annexure-title { 
                font-weight: 700; font-size: 12pt; margin-top: 10px; margin-bottom: 15px; 
                color: #0f172a; background-color: #f8fafc !important; 
                -webkit-print-color-adjust: exact; print-color-adjust: exact;
                padding: 6px 10px; border-left: 4px solid #3b82f6; 
            }
            
            /* Cover Page Styling */
            .cover-page { height: 95vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 3px solid #1e293b; padding: 30px; box-sizing: border-box; }
            .cover-title { font-size: 28pt; font-weight: 800; margin-bottom: 10px; color: #0f172a; text-transform: uppercase; letter-spacing: 2px; }
            .cover-subtitle { font-size: 18pt; margin-bottom: 40px; font-weight: 600; color: #334155; }
            .cover-details { text-align: left; border-top: 2px solid #cbd5e1; padding-top: 25px; width: 85%; margin: 0 auto; }
            .cover-details p { font-size: 12pt; margin-bottom: 10px; display: flex; justify-content: space-between; }
            .cover-details span { font-weight: 600; color: #0f172a; }
        }
        
        .print-only { display: none; }
        .table th { background-color: #1e293b; color: white; font-weight: 500; }
        .text-primary { color: #2563eb !important; }
        .btn-remove { font-weight: bold; padding: 0.25rem 0.5rem; }
        
        .validator-box { border-radius: 6px; padding: 12px; margin-bottom: 15px; border: 1px solid transparent; transition: all 0.3s ease; }
        .validator-success { background-color: #d1fae5; border-color: #34d399; color: #065f46; }
        .validator-error { background-color: #fee2e2; border-color: #f87171; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container py-4 no-print" id="inputSection">
        <div class="tool-header d-flex justify-content-between align-items-center">
            <div>
                <h3 class="mb-1 fw-bold">Professional Project Report Automator</h3>
                <small class="text-light opacity-75">Auto-generates detailed financial models & PDF reports</small>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">Project & Business Details</div>
                    <div class="card-body">
                        <div class="mb-3"><label>Business Name</label><input type="text" id="bizName" class="form-control" value="Chidanda Poultry Farms"></div>
                        <div class="mb-3"><label>Proprietor Name</label><input type="text" id="propName" class="form-control" value="Mr. Chidanda"></div>
                        <div class="mb-3"><label>Location</label><input type="text" id="bizLoc" class="form-control" value="Bantwal, Karnataka"></div>
                        <div class="mb-3"><label>Project Type</label>
                            <select id="bizType" class="form-select">
                                <option value="Trading">Trading</option>
                                <option value="Service">Service</option>
                                <option value="Agro / Manufacturing" selected>Agro / Manufacturing</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">Loan & Financial Parameters</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-6 mb-3"><label>Loan Amount (₹)</label><input type="number" id="loanAmt" class="form-control cost-input" value="100000"></div>
                            <div class="col-6 mb-3"><label>Own Contribution (₹)</label><input type="number" id="ownCont" class="form-control cost-input" value="50000"></div>
                            <div class="col-6 mb-3"><label>Loan Term (Years)</label><input type="number" id="term" class="form-control" value="5"></div>
                            <div class="col-6 mb-3"><label>Interest Rate (% p.a)</label><input type="number" step="0.1" id="roi" class="form-control" value="11.5"></div>
                            <div class="col-6 mb-3"><label>Target DSCR (Avg)</label><input type="number" step="0.1" id="targetDscr" class="form-control" value="2"></div>
                            <div class="col-6 mb-3"><label>Gross Profit Margin (%)</label><input type="number" step="0.1" id="gpm" class="form-control" value="15"></div>
                            <div class="col-12 mb-3"><label>Corporate Tax Rate (%)</label><input type="number" step="0.1" id="tax" class="form-control" value="0"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-7">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Project Utilization</span>
                        <button class="btn btn-sm btn-primary" onclick="addAsset()">+ Add Item</button>
                    </div>
                    <div class="card-body" id="assetsList">
                        <div class="row mb-2 asset-row align-items-center gx-2">
                            <div class="col-3">
                                <select class="form-select form-select-sm a-type" onchange="toggleDepr(this)">
                                    <option value="Asset" selected>Asset</option>
                                    <option value="WC">Working Capital</option>
                                </select>
                            </div>
                            <div class="col-4"><input type="text" class="form-control form-control-sm a-name" value="Fixed Asset"></div>
                            <div class="col-2"><input type="number" class="form-control form-control-sm a-amt util-input" value="100000" placeholder="Amount"></div>
                            <div class="col-2"><input type="number" class="form-control form-control-sm a-rate" value="10" placeholder="Depr %"></div>
                            <div class="col-1 text-end"><button class="btn btn-sm btn-outline-danger btn-remove w-100" onclick="removeRow(this)">X</button></div>
                        </div>
                        <div class="row mb-2 asset-row align-items-center gx-2">
                            <div class="col-3">
                                <select class="form-select form-select-sm a-type" onchange="toggleDepr(this)">
                                    <option value="Asset">Asset</option>
                                    <option value="WC" selected>Working Capital</option>
                                </select>
                            </div>
                            <div class="col-4"><input type="text" class="form-control form-control-sm a-name" value="Working Capital Margin"></div>
                            <div class="col-2"><input type="number" class="form-control form-control-sm a-amt util-input" value="50000" placeholder="Amount"></div>
                            <div class="col-2"><input type="number" class="form-control form-control-sm a-rate" disabled placeholder="N/A"></div>
                            <div class="col-1 text-end"><button class="btn btn-sm btn-outline-danger btn-remove w-100" onclick="removeRow(this)">X</button></div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Major Expenses (Recurring)</span>
                        <button class="btn btn-sm btn-primary" onclick="addExpense()">+ Add Expense</button>
                    </div>
                    <div class="card-body" id="expensesList">
                        <div class="row mb-2 exp-row align-items-center gx-2">
                            <div class="col-5"><input type="text" class="form-control form-control-sm e-name" value="Labor & Maintenance"></div>
                            <div class="col-3"><input type="number" class="form-control form-control-sm e-amt" value="15000" placeholder="Amt (Yr 1)"></div>
                            <div class="col-3"><input type="number" class="form-control form-control-sm e-inf" value="5" placeholder="Inf %"></div>
                            <div class="col-1 text-end"><button class="btn btn-sm btn-outline-danger btn-remove w-100" onclick="removeRow(this)">X</button></div>
                        </div>
                        <div class="row mb-2 exp-row align-items-center gx-2">
                            <div class="col-5"><input type="text" class="form-control form-control-sm e-name" value="Feed, Power & Misc"></div>
                            <div class="col-3"><input type="number" class="form-control form-control-sm e-amt" value="10000" placeholder="Amt (Yr 1)"></div>
                            <div class="col-3"><input type="number" class="form-control form-control-sm e-inf" value="8" placeholder="Inf %"></div>
                            <div class="col-1 text-end"><button class="btn btn-sm btn-outline-danger btn-remove w-100" onclick="removeRow(this)">X</button></div>
                        </div>
                    </div>
                </div>
                
                <div id="validationBox" class="validator-box validator-error text-center">
                    <div class="d-flex justify-content-around fw-bold mb-1">
                        <span>Total Project Cost: <span id="valCost">₹0</span></span>
                        <span>Total Utilization: <span id="valUtil">₹0</span></span>
                    </div>
                    <div id="valMessage" class="small">Checking balance...</div>
                </div>
                
                <button id="generateBtn" class="btn btn-success w-100 py-3 fw-bold shadow-sm" style="font-size: 1.1rem;" onclick="processReport()" disabled>Generate Professional Report</button>
            </div>
        </div>
    </div>

    <!-- Output Section -->
    <div class="container-fluid report-container bg-white d-none p-4" id="outputSection">
        <div class="text-end mb-4 no-print border-bottom pb-3">
            <button class="btn btn-outline-secondary me-2 fw-bold" onclick="editInputs()">Back to Edit</button>
            <button class="btn btn-primary fw-bold" onclick="window.print()">Export to PDF (Print)</button>
        </div>
        
        <div id="reportContent" class="container-fluid px-0"></div>
    </div>

    <script>
        const formatter = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
        const numFormat = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 });

        function getNum(id, def) {
            let val = parseFloat(document.getElementById(id).value);
            return isNaN(val) ? def : val;
        }
        
        // --- VALIDATOR LOGIC ---
        function validateTotals() {
            let loanAmt = getNum('loanAmt', 0);
            let ownCont = getNum('ownCont', 0);
            let totalCost = loanAmt + ownCont;

            let totalUtil = 0;
            document.querySelectorAll('.a-amt').forEach(el => {
                totalUtil += (parseFloat(el.value) || 0);
            });

            document.getElementById('valCost').innerText = formatter.format(totalCost);
            document.getElementById('valUtil').innerText = formatter.format(totalUtil);
            
            let valBox = document.getElementById('validationBox');
            let valMsg = document.getElementById('valMessage');
            let genBtn = document.getElementById('generateBtn');
            
            let diff = totalCost - totalUtil;

            if (totalCost === 0) {
                valBox.className = "validator-box validator-error text-center";
                valMsg.innerText = "Project cost cannot be zero.";
                genBtn.disabled = true;
            } else if (diff === 0) {
                valBox.className = "validator-box validator-success text-center";
                valMsg.innerText = "✅ Perfectly Balanced!";
                genBtn.disabled = false;
            } else {
                valBox.className = "validator-box validator-error text-center";
                let diffText = diff > 0 ? `Unallocated Cost: ${formatter.format(diff)}` : `Over-utilized by: ${formatter.format(Math.abs(diff))}`;
                valMsg.innerText = `❌ Unbalanced. ${diffText} (Difference must be 0)`;
                genBtn.disabled = true;
            }
        }

        // Attach event listeners to entire input section for delegated validation
        document.getElementById('inputSection').addEventListener('input', validateTotals);
        window.addEventListener('load', validateTotals);
        // ------------------------

        function toggleDepr(selectEl) {
            let row = selectEl.closest('.asset-row');
            let deprInput = row.querySelector('.a-rate');
            if (selectEl.value === 'WC') {
                deprInput.value = '';
                deprInput.disabled = true;
                deprInput.placeholder = 'N/A';
            } else {
                deprInput.disabled = false;
                deprInput.placeholder = 'Depr %';
            }
            validateTotals();
        }

        function removeRow(btn) {
            btn.parentElement.parentElement.remove();
            validateTotals();
        }

        function addAsset() {
            const div = document.createElement('div');
            div.className = 'row mb-2 asset-row align-items-center gx-2';
            div.innerHTML = `<div class="col-3">
                                <select class="form-select form-select-sm a-type" onchange="toggleDepr(this)">
                                    <option value="Asset">Asset</option>
                                    <option value="WC">Working Capital</option>
                                </select>
                             </div>
                             <div class="col-4"><input type="text" class="form-control form-control-sm a-name" placeholder="Item Name"></div>
                             <div class="col-2"><input type="number" class="form-control form-control-sm a-amt util-input" placeholder="Amount"></div>
                             <div class="col-2"><input type="number" class="form-control form-control-sm a-rate" placeholder="Depr %"></div>
                             <div class="col-1 text-end"><button class="btn btn-sm btn-outline-danger btn-remove w-100" onclick="removeRow(this)">X</button></div>`;
            document.getElementById('assetsList').appendChild(div);
            validateTotals();
        }

        function addExpense() {
            const div = document.createElement('div');
            div.className = 'row mb-2 exp-row align-items-center gx-2';
            div.innerHTML = `<div class="col-5"><input type="text" class="form-control form-control-sm e-name" placeholder="Expense Name"></div>
                             <div class="col-3"><input type="number" class="form-control form-control-sm e-amt" placeholder="Amt (Yr 1)"></div>
                             <div class="col-3"><input type="number" class="form-control form-control-sm e-inf" placeholder="Inf %"></div>
                             <div class="col-1 text-end"><button class="btn btn-sm btn-outline-danger btn-remove w-100" onclick="removeRow(this)">X</button></div>`;
            document.getElementById('expensesList').appendChild(div);
        }

        function editInputs() {
            document.getElementById('outputSection').classList.add('d-none');
            document.getElementById('inputSection').classList.remove('d-none');
            validateTotals();
        }

        function processReport() {
            let inputs = {
                bizName: document.getElementById('bizName').value,
                propName: document.getElementById('propName').value,
                location: document.getElementById('bizLoc').value,
                type: document.getElementById('bizType').value,
                loanAmount: getNum('loanAmt', 0),
                ownContrib: getNum('ownCont', 0),
                term: getNum('term', 5),
                roi: getNum('roi', 10),
                targetDscr: getNum('targetDscr', 1.5),
                gpm: getNum('gpm', 30),
                taxRate: getNum('tax', 0),
                assets: [],
                wc: 0,
                expenses: []
            };

            let totalWC = 0;
            document.querySelectorAll('.asset-row').forEach(r => {
                let pType = r.querySelector('.a-type').value;
                let name = r.querySelector('.a-name').value;
                let amt = parseFloat(r.querySelector('.a-amt').value);
                
                if(name && amt) {
                    if (pType === 'Asset') {
                        let rate = parseFloat(r.querySelector('.a-rate').value) || 0;
                        inputs.assets.push({name, amt, rate});
                    } else {
                        totalWC += amt;
                    }
                }
            });
            inputs.wc = totalWC;

            document.querySelectorAll('.exp-row').forEach(r => {
                let name = r.querySelector('.e-name').value;
                let amt = parseFloat(r.querySelector('.e-amt').value);
                let inf = parseFloat(r.querySelector('.e-inf').value);
                if(name && amt) inputs.expenses.push({name, amt, inf});
            });

            // Goal Seek for Base Sales to match Target DSCR
            let minS = 10, maxS = 100000000, bestS = 1000, result = null;
            for(let i=0; i<60; i++) {
                let mid = (minS + maxS) / 2;
                result = simulateFinance(mid, inputs);
                if(result.avgDscr < inputs.targetDscr) minS = mid;
                else { maxS = mid; bestS = mid; }
            }
            
            let finalData = simulateFinance(bestS, inputs);
            renderReport(finalData, inputs);
            
            document.getElementById('inputSection').classList.add('d-none');
            document.getElementById('outputSection').classList.remove('d-none');
        }

        function simulateFinance(baseSales, inp) {
            let n = inp.term;
            let r_monthly = (inp.roi / 100) / 12;
            let emi = (inp.loanAmount * r_monthly * Math.pow(1+r_monthly, n*12)) / (Math.pow(1+r_monthly, n*12) - 1);
            
            let loanSched = [];
            let bal = inp.loanAmount;
            for(let y=1; y<=n; y++) {
                let yInt = 0, yPrin = 0;
                let opBal = bal;
                for(let m=1; m<=12; m++) {
                    let i = bal * r_monthly;
                    let p = emi - i;
                    yInt += i; yPrin += p; bal -= p;
                }
                loanSched.push({ year: y, op: opBal, int: yInt, prin: yPrin, close: bal });
            }

            // Detailed Depreciation per Asset
            let deprSched = [];
            let wdvAssets = inp.assets.map(a => ({ name: a.name, rate: a.rate, wdv: a.amt }));
            for(let y=1; y<=n; y++) {
                let yAssets = [];
                let yDeprTotal = 0, yWdvTotal = 0;
                
                wdvAssets.forEach(a => {
                    let d = a.wdv * (a.rate / 100);
                    let cl = a.wdv - d;
                    yAssets.push({ name: a.name, rate: a.rate, op: a.wdv, dep: d, cl: cl });
                    yDeprTotal += d;
                    yWdvTotal += cl;
                    a.wdv = cl; // update for next year loop
                });
                deprSched.push({ year: y, assets: yAssets, deprTotal: yDeprTotal, wdvTotal: yWdvTotal });
            }

            let pl=[], cf=[], bs=[], dscr=[], payback=[];
            let initialInv = inp.loanAmount + inp.ownContrib;
            let initialFA = inp.assets.reduce((sum, a) => sum + a.amt, 0);
            
            // To perfectly balance BS from day 1, any excess funds not used in FA or WC stay as cash.
            // With the new strict validation, prevCash will essentially always be 0 starting out, keeping accounting pure.
            let prevCash = initialInv - initialFA - inp.wc; 
            let prevCap = inp.ownContrib;
            let totalDscr = 0, cumInflow = 0;
            let currentSales = baseSales;
            
            for(let y=1; y<=n; y++) {
                let gp = currentSales * (inp.gpm / 100);
                let cogs = currentSales - gp;
                
                let expDetails = [];
                let totalExps = 0;
                inp.expenses.forEach(e => {
                    let eAmt = e.amt * Math.pow(1 + e.inf/100, y-1);
                    expDetails.push({ name: e.name, amt: eAmt });
                    totalExps += eAmt;
                });
                
                let d = deprSched[y-1] ? deprSched[y-1].deprTotal : 0;
                let i = loanSched[y-1].int;
                let pbt = gp - totalExps - d - i;
                let tax = pbt > 0 ? pbt * (inp.taxRate / 100) : 0;
                let pat = pbt - tax;

                let yrDscr = (pat + d + i) / (loanSched[y-1].prin + i);
                totalDscr += yrDscr;

                let availCash = prevCash + pat + d - loanSched[y-1].prin;
                let idealCash = currentSales * 0.05; 
                let draw = availCash > idealCash ? availCash - idealCash : 0;
                let closeCash = availCash - draw;

                let cap = prevCap + pat - draw;
                let lClose = loanSched[y-1].close > 0 ? loanSched[y-1].close : 0;
                let fa = deprSched[y-1] ? deprSched[y-1].wdvTotal : 0;

                pl.push({ sales: currentSales, cogs, gp, expDetails, totalExps, d, i, pbt, tax, pat });
                cf.push({ opCash: prevCash, pat, d, prin: loanSched[y-1].prin, draw, clCash: closeCash });
                bs.push({ cap, loan: lClose, fa, wc: inp.wc, cash: closeCash });
                dscr.push({ pat, d, i, prin: loanSched[y-1].prin, ratio: yrDscr });

                let inflow = pat + d;
                cumInflow += inflow;
                payback.push({ year: y, inflow, cum: cumInflow, status: cumInflow >= initialInv ? 'Recovered' : 'Pending' });

                prevCash = closeCash;
                prevCap = cap;
                currentSales *= 1.08; // 8% avg growth assumption
            }

            return { avgDscr: totalDscr/n, emi, loanSched, deprSched, pl, cf, bs, dscr, payback, initialInv, initialFA };
        }

        function buildTable(title, headers, rows) {
            let html = `<div class="annexure-title">${title}</div>`;
            html += `<table class="table table-bordered table-sm table-striped shadow-sm bg-white w-100"><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;
            rows.forEach(r => {
                html += `<tr>`;
                r.forEach((c, idx) => {
                    let align = idx === 0 ? 'text-start' : 'text-end';
                    let val = typeof c === 'number' ? formatter.format(c) : c;
                    html += `<td class="${align}">${val}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        function renderReport(data, inp) {
            let yearsHead = ['Particulars'];
            for(let i=1; i<=inp.term; i++) yearsHead.push(`Year ${i}`);

            let html = `
                <div class="cover-page print-only">
                    <h1 class="cover-title">PROJECT REPORT</h1>
                    <h2 class="cover-subtitle">${inp.bizName}</h2>
                    <div class="cover-details">
                        <p>Proprietor: <span>${inp.propName}</span></p>
                        <p>Location: <span>${inp.location}</span></p>
                        <p>Nature of Business: <span>${inp.type}</span></p>
                        <p>Total Project Cost: <span>${formatter.format(data.initialInv)}</span></p>
                        <p>Term Loan: <span>${formatter.format(inp.loanAmount)}</span></p>
                    </div>
                </div>
                <div class="page-break print-only"></div>
                
                <h3 class="text-center mb-4 border-bottom pb-3 fw-bold" style="color: #0f172a;">Executive Project Summary</h3>
                <table class="table table-bordered mb-5 shadow-sm bg-white w-100">
                    <tr><th>Business Name</th><td>${inp.bizName}</td><th>Proprietor</th><td>${inp.propName}</td></tr>
                    <tr><th>Total Financial Outlay</th><td>${formatter.format(data.initialInv)}</td><th>Loan Amount</th><td>${formatter.format(inp.loanAmount)}</td></tr>
                    <tr><th>Fixed Assets Cost</th><td>${formatter.format(data.initialFA)}</td><th>Working Capital Margin</th><td>${formatter.format(inp.wc)}</td></tr>
                    <tr><th>Interest Rate</th><td>${inp.roi}% p.a.</td><th>Term</th><td>${inp.term} Years</td></tr>
                    <tr><th>Calculated EMI</th><td>${formatter.format(data.emi)} / month</td><th>Target / Avg DSCR</th><td>${numFormat.format(data.avgDscr)}</td></tr>
                </table>
                <div class="page-break print-only"></div>
            `;

            // 1. Detailed Profitability
            let plRows = [
                ['<span class="fw-bold text-dark">Gross Receipts / Sales</span>', ...data.pl.map(p=>p.sales)],
                ['Less: Cost of Goods / Direct Exp', ...data.pl.map(p=>p.cogs)],
                ['<span class="fw-bold text-dark">Gross Profit</span>', ...data.pl.map(p=>p.gp)]
            ];
            
            inp.expenses.forEach((e, idx) => {
                plRows.push([`Less: ${e.name}`, ...data.pl.map(p => p.expDetails[idx].amt)]);
            });

            plRows.push(
                ['<span class="fw-bold text-dark">Total Indirect Expenses</span>', ...data.pl.map(p=>p.totalExps)],
                ['<span class="fw-bold text-dark">EBITDA</span>', ...data.pl.map(p=>p.gp - p.totalExps)],
                ['Less: Depreciation', ...data.pl.map(p=>p.d)],
                ['Less: Interest on Term Loan', ...data.pl.map(p=>p.i)],
                ['<span class="fw-bold text-dark">Profit Before Tax (PBT)</span>', ...data.pl.map(p=>p.pbt)],
                ['Less: Corporate Tax', ...data.pl.map(p=>p.tax)],
                ['<span class="fw-bold text-success">Net Profit After Tax (PAT)</span>', ...data.pl.map(p=>p.pat)]
            );
            
            html += buildTable('Annexure 1: Projected Profitability Statement', yearsHead, plRows);
            html += `<div class="page-break print-only"></div>`;

            // 2. Cash Flow
            let cfRows = [
                ['Opening Cash Balance', ...data.cf.map(c=>c.opCash)],
                ['Add: Net Profit (PAT)', ...data.cf.map(c=>c.pat)],
                ['Add: Depreciation', ...data.cf.map(c=>c.d)],
                ['Less: Principal Repayment', ...data.cf.map(c=>c.prin)],
                ['Less: Partner/Proprietor Drawings', ...data.cf.map(c=>c.draw)],
                ['<span class="fw-bold text-dark">Closing Cash Balance</span>', ...data.cf.map(c=>c.clCash)]
            ];
            html += buildTable('Annexure 2: Projected Cash Flow Statement', yearsHead, cfRows);
            html += `<div class="page-break print-only"></div>`;

            // 3. Detailed Depreciation
            let depRows = [];
            if (data.deprSched.length > 0) {
                data.deprSched.forEach(ds => {
                    depRows.push([`<span class="fw-bold text-primary">Year ${ds.year}</span>`, '', '', '', '']);
                    ds.assets.forEach(a => {
                        depRows.push([a.name, a.rate + '%', a.op, a.dep, a.cl]);
                    });
                    depRows.push([
                        '<span class="fw-bold text-dark">Total</span>', '', '', 
                        `<span class="fw-bold text-dark">${formatter.format(ds.deprTotal)}</span>`, 
                        `<span class="fw-bold text-dark">${formatter.format(ds.wdvTotal)}</span>`
                    ]);
                });
                html += buildTable('Annexure 3: Detailed Asset Depreciation', ['Particulars', 'Rate', 'Opening WDV', 'Depreciation', 'Closing WDV'], depRows);
            } else {
                html += `<div class="annexure-title">Annexure 3: Detailed Asset Depreciation</div><p class="p-3 border">No depreciable assets found in project utilization.</p>`;
            }
            html += `<div class="page-break print-only"></div>`;

            // 4. DSCR
            let dscrRows = data.dscr.map((d, i) => [
                `Year ${i+1}`, d.pat, d.d, d.i, d.pat+d.d+d.i, d.prin+d.i, numFormat.format(d.ratio)
            ]);
            html += buildTable('Annexure 4: Debt Service Coverage Ratio (DSCR)', ['Year', 'PAT', 'Depreciation', 'Interest', 'Cash Accruals', 'Repayment + Int', 'DSCR'], dscrRows);
            html += `<div class="page-break print-only"></div>`;

            // 5. Loan Schedule
            let loanRows = data.loanSched.map(l => [`Year ${l.year}`, l.op, l.int, l.prin, l.close]);
            html += buildTable('Annexure 5: Interest & Repayment Schedule', ['Year', 'Opening Balance', 'Interest', 'Principal Repayment', 'Closing Balance'], loanRows);
            html += `<div class="page-break print-only"></div>`;

            // 6. Return on Investment
            let roiRows = data.pl.map((p, i) => [`Year ${i+1}`, p.pat, data.initialInv, numFormat.format((p.pat/data.initialInv)*100) + '%']);
            html += buildTable('Annexure 6: Return on Investment (ROI)', ['Year', 'Net Profit (PAT)', 'Total Investment', 'ROI %'], roiRows);
            html += `<div class="page-break print-only"></div>`;

            // 7. Balance Sheet
            let bsRows = [
                ['Capital Account', ...data.bs.map(b=>b.cap)],
                ['Term Loan', ...data.bs.map(b=>b.loan)],
                ['<span class="fw-bold text-dark">Total Liabilities</span>', ...data.bs.map(b=>b.cap + b.loan)],
                ['Fixed Assets (Net Block)', ...data.bs.map(b=>b.fa)],
                ['Working Capital', ...data.bs.map(b=>b.wc)],
                ['Cash & Bank Balance', ...data.bs.map(b=>b.cash)],
                ['<span class="fw-bold text-dark">Total Assets</span>', ...data.bs.map(b=>b.fa + b.wc + b.cash)]
            ];
            html += buildTable('Annexure 7: Projected Balance Sheet', yearsHead, bsRows);
            html += `<div class="page-break print-only"></div>`;

            // 8. Payback Period
            let pbRows = data.payback.map(p => [
                `Year ${p.year}`, 
                p.inflow, 
                p.cum, 
                `<span class="badge ${p.status === 'Recovered' ? 'bg-success' : 'bg-warning text-dark'}">${p.status}</span>`
            ]);
            html += buildTable('Annexure 8: Payback Period Calculation', ['Year', 'Annual Cash Inflow', 'Cumulative Cash Inflow', 'Recovery Status'], pbRows);
            
            document.getElementById('reportContent').innerHTML = html;
        }
    </script>
</body>
</html>
